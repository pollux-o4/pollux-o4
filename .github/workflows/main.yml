name: Profile contributions

on:
  schedule: # 03:00 JST == 18:00 UTC
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: render-contribution-panel
    steps:
      - uses: actions/checkout@v5
      - name: Render contribution heatmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/build.py live
      - name: Commit & Push
        run: |
          git config user.name pollux-o4
          git config user.email pollux-o4@users.noreply.github.com
          git add assets/contrib-*.svg
          if git commit -m "generated"; then
            git push
          fi
